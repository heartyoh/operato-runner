[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operato-runner"
version = "1.1.26"
description = "Multi-execution environment platform for safely running Python modules"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Operato Team", email = "admin@example.com"}
]
keywords = ["python", "execution", "environment", "docker", "virtualenv", "conda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "pyyaml>=6.0",
    "docker>=6.0.0",
    "protobuf>=4.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.17.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.8.0",
    "greenlet>=2.0.0",
    "asyncpg>=0.27.0",
    "psycopg2-binary>=2.9.0",
    "email-validator>=2.0.0",
    "dnspython>=2.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
    "humanize>=4.0.0",
    "redis>=4.5.0",
    "aioredis>=2.0.0",
    "aiofiles>=23.0.0",
    "opencv-python>=4.5.0",
    "uv>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0"
]

test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "coverage>=7.0.0"
]

security = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "semgrep>=1.0.0"
]

[project.scripts]
operato-runner = "src.main:main"

[project.urls]
Homepage = "https://github.com/operato/operato-runner"
Documentation = "https://github.com/operato/operato-runner/blob/main/README.md"
Repository = "https://github.com/operato/operato-runner"
Issues = "https://github.com/operato/operato-runner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.proto"]

# === Development Tools Configuration ===

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
target-version = "py38"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "docker.*",
    "grpc.*",
    "alembic.*",
    "cv2.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.operato-runner]
# Custom configuration for operato-runner
runtime_dirs = [
    "runtime/module_envs",
    "runtime/uploads", 
    "runtime/logs",
    "runtime/temp"
]
default_venv_path = "runtime/module_envs"
default_modules_path = "runtime/modules"