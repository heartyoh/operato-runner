version: "3.8"

services:
  # 백엔드 서비스
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operato-backend
    ports:
      - "8000:8000" # REST API
      - "50051:50051" # gRPC
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - DATABASE_URL=${DATABASE_URL}
    command: >
      sh -c "alembic upgrade head && python main.py --rest-port 8000 --grpc-port 50051 --no-redis"
    volumes:
      - ./modules:/app/modules
      - ./module_envs:/app/module_envs
      - ./app.db:/app/app.db
      - ./.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - operato-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 프론트엔드 서비스
  frontend:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    container_name: operato-frontend
    ports:
      - "3000:80" # 웹 UI
    depends_on:
      - backend
    networks:
      - operato-network
    restart: unless-stopped
    volumes:
      - ./admin-ui/nginx.conf:/etc/nginx/nginx.conf

  # PostgreSQL 데이터베이스 (선택사항)
  postgres:
    image: postgres:15-alpine
    container_name: operato-postgres
    environment:
      POSTGRES_DB: operato
      POSTGRES_USER: operato
      POSTGRES_PASSWORD: operato123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - operato-network
    restart: unless-stopped

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: operato-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - operato-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  operato-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
